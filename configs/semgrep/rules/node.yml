# Rules for the mistakes AI-generated Express / Node code makes most often.
# They add to the public Semgrep rule packs; they do not replace them.
# Every rule has cases in ../tests/node.js. Run the rule tests after changing one (see README).
#
# severity ERROR blocks a pull request. WARNING is reported but does not block.
rules:
  - id: quantum-secret-env-fallback
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      `process.env.$VAR` falls back to a hardcoded value. If the variable is ever missing in
      production, the app silently runs with a secret that anyone can read in the source code.
      Remove the fallback and stop at startup when the variable is not set.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: process.env.$VAR || "..."
          - pattern: process.env.$VAR ?? "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(secret|password|passwd|token|api_?key|private_?key).*

  - id: quantum-nosql-query-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The whole request object is used as a database filter, so the caller decides what the
      query matches and can read or change records that are not theirs. Build the filter
      from named fields and convert each one to the type you expect.
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: $MODEL.$METHOD(req.body, ...)
          - pattern: $MODEL.$METHOD(req.query, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|exists)$

  - id: quantum-nosql-operator-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A value from the request reaches a database filter without a type check. A JSON body
      such as {"email": {"$ne": null}} turns the value into a query operator and matches
      records the caller should not reach. Convert it first, for example String(email),
      or validate the request with a schema.
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $VALUE.toString()
      - pattern: $SCHEMA.parse(...)
      - pattern: $SCHEMA.safeParse(...)
      - pattern: $SCHEMA.validate(...)
      - pattern: $SCHEMA.validateAsync(...)
      - pattern: sanitize(...)
    pattern-sinks:
      - patterns:
          - pattern: $MODEL.$METHOD($FILTER, ...)
          # Reported by quantum-nosql-query-from-request instead.
          - pattern-not: $MODEL.$METHOD(req.body, ...)
          - pattern-not: $MODEL.$METHOD(req.query, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|exists)$
          - focus-metavariable: $FILTER

  - id: quantum-mass-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The request body is written to the database as it is, so a caller can set fields you
      did not intend, such as role or isAdmin. Copy only the fields this endpoint may change.
    metadata:
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: "A08:2021 - Software and Data Integrity Failures"
    pattern-either:
      - pattern: new $MODEL(req.body)
      - pattern: $MODEL.create(req.body, ...)
      - pattern: $MODEL.findByIdAndUpdate($ID, req.body, ...)
      - pattern: $MODEL.findOneAndUpdate($FILTER, req.body, ...)
      - pattern: $MODEL.updateOne($FILTER, req.body, ...)
      - pattern: Object.assign($DOCUMENT, req.body)

  - id: quantum-jwt-no-expiry
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This token never expires, so a stolen token works forever. Pass `expiresIn`, and keep
      it short for access tokens.
    metadata:
      category: security
      cwe: "CWE-613: Insufficient Session Expiration"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: $JWT.sign($PAYLOAD, $SECRET)
          - patterns:
              - pattern: $JWT.sign($PAYLOAD, $SECRET, {...})
              - pattern-not: '$JWT.sign($PAYLOAD, $SECRET, {..., expiresIn: $EXPIRY, ...})'
      - metavariable-regex:
          metavariable: $JWT
          regex: ^(jwt|jsonwebtoken)$

  - id: quantum-cors-allow-all
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      CORS is open to every origin, which lets any website call this API from a visitor's
      browser. List the origins that are allowed to call it.
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
    pattern-either:
      - pattern: cors()
      - pattern: 'cors({..., origin: "*", ...})'
      - pattern: 'cors({..., origin: true, ...})'

  - id: quantum-error-stack-in-response
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A stack trace is sent to the client. It reveals file paths, library versions, and
      query details that help an attacker. Log it on the server and return a generic message.
    metadata:
      category: security
      cwe: "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp: "A05:2021 - Security Misconfiguration"
    pattern-either:
      - pattern: '$RES.json({..., $KEY: $ERR.stack, ...})'
      - pattern: $RES.send($ERR.stack)

  - id: quantum-multer-no-limits
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Uploads have no size limit, so one request can fill the disk or the memory of the
      server. Set `limits.fileSize`, and check the file type with `fileFilter`.
    metadata:
      category: security
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A04:2021 - Insecure Design"
    patterns:
      - pattern-either:
          - pattern: multer()
          - pattern: multer({...})
      - pattern-not: 'multer({..., limits: $LIMITS, ...})'

  - id: quantum-bcrypt-low-rounds
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      bcrypt is used with fewer than 10 rounds, which makes stolen password hashes quick to
      crack. Use 12.
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A02:2021 - Cryptographic Failures"
    patterns:
      - pattern-either:
          - pattern: $BCRYPT.hash($PASSWORD, $ROUNDS, ...)
          - pattern: $BCRYPT.hashSync($PASSWORD, $ROUNDS)
          - pattern: $BCRYPT.genSalt($ROUNDS, ...)
          - pattern: $BCRYPT.genSaltSync($ROUNDS)
      - metavariable-regex:
          metavariable: $BCRYPT
          regex: ^(bcrypt|bcryptjs)$
      - metavariable-comparison:
          metavariable: $ROUNDS
          comparison: $ROUNDS < 10

  - id: quantum-cookie-not-httponly
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This cookie can be read by JavaScript in the page, so one cross-site scripting bug is
      enough to steal it. Set `httpOnly: true`, and also `secure: true` and `sameSite`.
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A05:2021 - Security Misconfiguration"
    patterns:
      - pattern-either:
          - pattern: $RES.cookie($NAME, $VALUE)
          - patterns:
              - pattern: $RES.cookie($NAME, $VALUE, {...})
              - pattern-not: '$RES.cookie($NAME, $VALUE, {..., httpOnly: true, ...})'
      - metavariable-regex:
          metavariable: $RES
          regex: ^(res|response|reply)$

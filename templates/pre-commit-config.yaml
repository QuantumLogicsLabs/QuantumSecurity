# Optional. Copy to .pre-commit-config.yaml in your project, then run:
#   pip install pre-commit
#   pre-commit install
# From then on Gitleaks checks every commit on your machine and refuses one that
# contains a secret, before it ever reaches GitHub.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

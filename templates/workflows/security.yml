# Copy to .github/workflows/security.yml in your project.
# Runs the shared QuantumLogicsLabs scans: secrets, dependencies, and code.
name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Mondays 04:00 UTC. New vulnerabilities are published every day, so code that
    # passed last week can fail today without a single commit.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: QuantumLogicsLabs/QuantumSecurity/.github/workflows/security.yml@main
    with:
      # false = report only. Change to true once the existing findings are fixed.
      enforce: false
